spring:
  application:
    name: b2b-showroom
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/showroom}
    username: ${DB_USERNAME:showroom}
    password: ${DB_PASSWORD:showroom-dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schemat jest wyłącznie w gestii Flyway
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  # SMTP dla e-maili transakcyjnych kont kupców (D23), używany przy showroom.mail.enabled=true.
  # Serwer i dane logowania ze zmiennych środowiskowych: SPRING_MAIL_HOST, SPRING_MAIL_PORT (587),
  # SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD. Domyślnie STARTTLS wymagany.
  mail:
    port: 587
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  # Za reverse proxy: adres klienta z X-Forwarded-For, ale tylko od zaufanych (wewnętrznych) proxy — Tomcat RemoteIpValve
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

showroom:
  storage:
    local-root: ${STORAGE_LOCAL_ROOT:./data/storage}
  security:
    jwt:
      secret: ${SHOWROOM_JWT_SECRET:}          # base64, min. 32 bajty: openssl rand -base64 48
      issuer: ${SHOWROOM_JWT_ISSUER:b2b-showroom}
      access-token-ttl: 15m
      refresh-token-ttl: 14d
      refresh-cookie-secure: ${SHOWROOM_REFRESH_COOKIE_SECURE:true}
    lockout:
      max-attempts: 5
      duration: 15m
    buyer:                            # konta kupców (D23)
      refresh-token-ttl: 30d
      email-verification-ttl: 48h
      password-reset-ttl: 1h
  mail:
    enabled: ${SHOWROOM_MAIL_ENABLED:false}           # false = e-maile tylko w logu (dev)
    from: ${SHOWROOM_MAIL_FROM:B2B Showroom <no-reply@localhost>}
    public-base-url: ${SHOWROOM_PUBLIC_BASE_URL:http://localhost:3000}   # z niego budowane są linki w e-mailach
    bootstrap-admin:
      email: ${SHOWROOM_ADMIN_EMAIL:}
      password: ${SHOWROOM_ADMIN_PASSWORD:}
  rate-limit:
    enabled: ${SHOWROOM_RATE_LIMIT_ENABLED:true}
    max-tracked-clients: 100000
    rules:
      - name: line-sheets             # generowanie PDF jest kosztowne
        method: POST
        path: /api/v1/buyer/line-sheets
        limits:
          - { capacity: 5, period: 1m }
          - { capacity: 30, period: 1h }
      - name: buyer-register          # każda rejestracja wysyła e-mail
        method: POST
        path: /api/v1/buyer/auth/register
        limits:
          - { capacity: 3, period: 1m }
          - { capacity: 10, period: 1h }
      - name: buyer-resend-verification
        method: POST
        path: /api/v1/buyer/auth/resend-verification
        limits:
          - { capacity: 3, period: 1m }
          - { capacity: 10, period: 1h }
      - name: buyer-password-reset-request
        method: POST
        path: /api/v1/buyer/auth/password-reset/request
        limits:
          - { capacity: 3, period: 1m }
          - { capacity: 10, period: 1h }
      - name: buyer-verify-email
        method: POST
        path: /api/v1/buyer/auth/verify-email
        limits:
          - { capacity: 10, period: 1m }
      - name: buyer-password-reset-confirm
        method: POST
        path: /api/v1/buyer/auth/password-reset/confirm
        limits:
          - { capacity: 10, period: 1m }
      - name: buyer-login             # uzupełnia blokadę konta, jak w panelu
        method: POST
        path: /api/v1/buyer/auth/login
        limits:
          - { capacity: 10, period: 1m }
          - { capacity: 50, period: 1h }
      - name: buyer-refresh
        method: POST
        path: /api/v1/buyer/auth/refresh
        limits:
          - { capacity: 30, period: 1m }
      - name: buyer-change-password
        method: POST
        path: /api/v1/buyer/me/password
        limits:
          - { capacity: 5, period: 1m }
      - name: analytics-events
        method: POST
        path: /api/v1/analytics/events
        limits:
          - { capacity: 60, period: 1m }
      - name: admin-login             # uzupełnia blokadę konta: ogranicza credential stuffing z jednego adresu
        method: POST
        path: /api/v1/admin/auth/login
        limits:
          - { capacity: 10, period: 1m }
          - { capacity: 50, period: 1h }
      - name: admin-refresh
        method: POST
        path: /api/v1/admin/auth/refresh
        limits:
          - { capacity: 30, period: 1m }
  brand:                              # dane marki w zestawieniach PDF — placeholdery do czasu identyfikacji (Etap 4)
    name: ${SHOWROOM_BRAND_NAME:Brand Name}
    legal-name: ${SHOWROOM_BRAND_LEGAL_NAME:}
    address-lines: []
    website: ${SHOWROOM_BRAND_WEBSITE:}
    email: ${SHOWROOM_BRAND_EMAIL:}
    phone: ${SHOWROOM_BRAND_PHONE:}
    accent-color: "#1F2A37"
    # logo: pdf/brand/logo.png          # opcjonalne logo PNG/JPEG z classpath; brak = wordmark z nazwy
    time-zone: Europe/Warsaw
