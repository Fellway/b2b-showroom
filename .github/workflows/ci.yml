# CI: testy backendu (Testcontainers), typy/lint/build frontendu przy każdym pushu i pull requeście.
# Na gałęzi main po zielonych testach: obrazy Dockera do GitHub Container Registry
#   ghcr.io/fellway/b2b-showroom-backend, ghcr.io/fellway/b2b-showroom-frontend  (tagi: latest, sha-<7 znaków>)
# Wdrożenie na serwerze: docs/deployment.md.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend — testy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # .mvn/settings.xml trzyma artefakty w ~/.m2/b2b-showroom-repository (decyzja D4)
      - uses: actions/cache@v4
        with:
          path: ~/.m2/b2b-showroom-repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Testy (Docker na runnerze obsługuje Testcontainers)
        run: ./mvnw -B -ntp verify
      - name: Raporty testów przy błędzie
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend — typy, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # globalne typy tras (PageProps, LayoutProps) powstają w .next/types — w czystym checkoucie trzeba je wygenerować
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx next build

  images:
    name: Obrazy → GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fellway/b2b-showroom-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          # NEXT_PUBLIC_* są wpisywane w kod przy buildzie — ustawiasz je w Settings → Variables → Actions repozytorium
          build-args: |
            NEXT_PUBLIC_DEMO_NOTICE=${{ vars.NEXT_PUBLIC_DEMO_NOTICE || 'true' }}
            NEXT_PUBLIC_PRIVACY_POLICY_URL=${{ vars.NEXT_PUBLIC_PRIVACY_POLICY_URL }}
